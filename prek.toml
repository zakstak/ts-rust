# Generated by pragma — https://github.com/zakstak/pragma
# To regenerate: ~/.pragma/install.sh <target-repo>

[[repos]]
repo = "local"

[[repos.hooks]]
id = "format"
# Keep pinned upstream input bytes, deliberate compiler fixtures and saved evidence intact.
exclude = '^(crates/ts_goport/(libs/|tests/(fixtures|effect_fixtures)/)|docs/typechecker-(state|batches)/|tools/[^/]+/spec/|licenses/)'
name = "format"
entry = ".pragma-hooks/format.sh"
language = "script"
files = '\.(go|rs|ts|tsx|js|jsx|html|htm|yml|yaml|sh|md|toml|json|py)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint"
# Fixtures exercise invalid syntax; the shipped libraries mirror pinned Go input.
exclude = '^(crates/ts_goport/(libs/|tests/(fixtures|effect_fixtures)/)|docs/probes/|scripts/goport/gen/unicode/)'
name = "lint"
entry = ".pragma-hooks/lint.sh"
language = "script"
files = '(\.(go|rs|ts|tsx|js|jsx|yml|yaml|sh|toml|py)$)|((^|/)([Dd]ockerfile(\.[^/]+)?|[^/]+\.[Dd]ockerfile)$)'
stages = ["pre-commit"]

[[repos.hooks]]
id = "kingfisher"
name = "kingfisher"
entry = ".pragma-hooks/secrets.sh"
language = "script"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "test"
name = "test"
entry = ".pragma-hooks/test.sh"
language = "script"
pass_filenames = false
always_run = true
stages = ["pre-push"]
